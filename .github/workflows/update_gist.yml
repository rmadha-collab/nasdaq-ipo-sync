name: Update Nasdaq IPO Gist

on:
  schedule:
    - cron: '0 13 * * *'   # 6:30 PM IST (13:00 UTC)
    - cron: '30 13 * * *'  # 7:00 PM IST (13:30 UTC)
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Nasdaq IPO Calendar and Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "6a907c7fad2ec453105e0f06dc95ef54"
        run: |
          python3 - << 'PYEOF'
          import os
          from datetime import datetime, timezone
          import requests

          url = "https://api.nasdaq.com/api/ipo/calendar"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
          }

          resp = requests.get(url, headers=headers, timeout=20)
          resp.raise_for_status()
          data = resp.json()

          upcoming_table = (data.get("data") or {}).get("upcoming", {}).get("upcomingTable")
          if not upcoming_table:
              current_month = datetime.now(timezone.utc).strftime("%Y-%m")
              resp2 = requests.get(url, params={"date": current_month}, headers=headers, timeout=20)
              if resp2.status_code == 200 and ((resp2.json().get("data") or {}).get("upcoming", {}).get("upcomingTable")):
                  resp = resp2

          gist_id = os.environ["GIST_ID"].strip()
          gist_token = os.environ["GIST_TOKEN"].strip()
          now_str = datetime.now(timezone.utc).isoformat()

          gist_resp = requests.patch(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {gist_token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json={
                  "description": f"Nasdaq IPO Calendar Data (Updated {now_str} via GitHub Actions)",
                  "files": {
                      "nasdaq_ipo.json": {
                          "content": resp.text
                      }
                  },
              },
              timeout=20,
          )
          gist_resp.raise_for_status()
          rows = (((resp.json().get("data") or {}).get("upcoming") or {}).get("upcomingTable") or {}).get("rows") or []
          print(f"Successfully updated Gist {gist_id} with {len(rows)} upcoming IPO row(s)!")
          PYEOF
