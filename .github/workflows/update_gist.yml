name: Update Nasdaq IPO Gist

on:
  schedule:
    - cron: '45 */2 * * *'  # Every 2 hours at :45 UTC (15m pre-hour buffer, avoids :00 queue spike)
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch 2-Month Nasdaq IPO Calendar and Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "6a907c7fad2ec453105e0f06dc95ef54"
        run: |
          python3 - << 'PYEOF'
          import os
          from datetime import datetime, timezone
          import requests

          url = "https://api.nasdaq.com/api/ipo/calendar"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
          }

          now = datetime.now(timezone.utc)
          current_month = now.strftime("%Y-%m")
          if now.month == 12:
              next_month = f"{now.year + 1}-01"
          else:
              next_month = f"{now.year}-{now.month + 1:02d}"

          months_to_fetch = [current_month, next_month]
          combined_rows = []
          seen_keys = set()
          base_payload = None

          for month_str in [None] + months_to_fetch:
              resp = requests.get(url, params={"date": month_str} if month_str else None, headers=headers, timeout=20)
              resp.raise_for_status()
              month_data = resp.json()
              if base_payload is None:
                  base_payload = month_data
              rows = (
                  ((month_data.get("data") or {}).get("upcoming") or {})
                  .get("upcomingTable", {})
                  .get("rows")
              ) or []
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  key = (
                      str(row.get("proposedTickerSymbol") or "").strip(),
                      str(row.get("expectedPriceDate") or "").strip(),
                      str(row.get("dealID") or "").strip(),
                  )
                  if key not in seen_keys:
                      seen_keys.add(key)
                      combined_rows.append(row)

          if not base_payload:
              base_payload = {"data": {"upcoming": {"upcomingTable": {"rows": []}}}}
          if not isinstance(base_payload.get("data"), dict):
              base_payload["data"] = {}
          if not isinstance(base_payload["data"].get("upcoming"), dict):
              base_payload["data"]["upcoming"] = {}
          if not isinstance(base_payload["data"]["upcoming"].get("upcomingTable"), dict):
              base_payload["data"]["upcoming"]["upcomingTable"] = {}
          base_payload["data"]["upcoming"]["upcomingTable"]["rows"] = combined_rows

          import json as _json
          content_str = _json.dumps(base_payload, indent=2)

          gist_id = os.environ["GIST_ID"].strip()
          gist_token = os.environ["GIST_TOKEN"].strip()
          now_str = now.isoformat()

          gist_resp = requests.patch(
              f"https://api.github.com/gists/{gist_id}",
              headers={
                  "Authorization": f"Bearer {gist_token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json={
                  "description": f"Nasdaq IPO Calendar Data ({', '.join(months_to_fetch)}, Updated {now_str} via GitHub Actions)",
                  "files": {
                      "nasdaq_ipo.json": {
                          "content": content_str
                      }
                  },
              },
              timeout=20,
          )
          gist_resp.raise_for_status()
          print(f"Successfully updated Gist {gist_id} for months {months_to_fetch} with {len(combined_rows)} upcoming IPO row(s)!")
          PYEOF
